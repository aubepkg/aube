# RustSec advisories. CI runs this instead of `cargo audit --deny warnings`,
# so these match its strictness: every vulnerability, notice, unmaintained,
# or unsound advisory anywhere in the graph and every yanked crate is an error.
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
# zstd 0.13.3 / zstd-safe 7.3.0 are reached only through decmpfs, which pins
# `zstd = "=0.13.3"` and has no newer release (0.1.5 is the latest). The fixes
# need zstd >= 0.14.3 / zstd-safe >= 8.2.0, which aube already uses directly.
# Drop these ignores once decmpfs releases against zstd 0.14.
ignore = [
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0395",
    "RUSTSEC-2026-0396",
    "RUSTSEC-2026-0397",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0399",
    "RUSTSEC-2026-0400",
    "RUSTSEC-2026-0401",
    "RUSTSEC-2026-0402",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0404",
    "RUSTSEC-2026-0405",
    "RUSTSEC-2026-0406",
]

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# MPL-2.0 is file-level copyleft. Distributing an executable that contains
# option-ext, even unmodified, requires making its source available and telling
# recipients how to obtain it (MPL-2.0 section 3.2); crates.io plus Cargo.lock
# satisfies that. Pulled in by sigstore-trust-root via directories.
exceptions = [{ allow = ["MPL-2.0"], crate = "option-ext" }]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git sources are blocked intentionally. The usage 6.x migration PR is an
# explicit pre-release experiment and removes this exception when it switches
# back to the published crates.
allow-git = ["https://github.com/jdx/usage"]
