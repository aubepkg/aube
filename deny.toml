# RustSec advisories. CI runs this instead of `cargo audit --deny warnings`,
# so these match its strictness: every vulnerability, notice, unmaintained,
# or unsound advisory anywhere in the graph and every yanked crate is an error.
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# MPL-2.0 is file-level copyleft; an unmodified dependency adds no obligations
# beyond keeping its notice. Pulled in by sigstore-trust-root via directories.
exceptions = [{ allow = ["MPL-2.0"], crate = "option-ext" }]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git sources are blocked intentionally. The usage 6.x migration PR is an
# explicit pre-release experiment and removes this exception when it switches
# back to the published crates.
allow-git = ["https://github.com/jdx/usage"]
