name: upm performance probe
on:
  push:
    branches: [perf/upm-install-less-work]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /tmp/upm-target
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: false
      - name: Install cargo wrapper
        working-directory: .
        run: mise trust && mise install mr-boxington
      - name: Check and test candidate
        working-directory: .
        run: |
          mise exec -- cargo check --locked --workspace --all-targets
          mise exec -- cargo test --locked -p aube-store -p aube-linker --lib
          mise exec -- cargo test --locked -p aube --lib remap
      - name: Build paired examples
        run: |
          git worktree add --detach /tmp/upm-base 8f375c93
          mkdir -p /tmp/upm-base/crates/aube/examples
          cp crates/aube/examples/index_remap.rs /tmp/upm-base/crates/aube/examples/
          python3 .github/upm-prepare-base.py
          cd /tmp/upm-base/
          mise trust
          mise exec -- cargo build --locked --release -p aube --bin aube --example index_remap
          cp /tmp/upm-target/release/examples/index_remap /tmp/index-base
          cp /tmp/upm-target/release/aube /tmp/aube-base
          cd "$GITHUB_WORKSPACE/"
          mise exec -- cargo build --locked --release -p aube --bin aube --example index_remap
          cp /tmp/upm-target/release/examples/index_remap /tmp/index-candidate
          cp /tmp/upm-target/release/aube /tmp/aube-candidate
      - name: Alternate paired samples
        run: python3 .github/upm-index-probe.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: upm-index-results
          path: /tmp/results.json
