name: node-addon

on:
  pull_request:
    paths: ["crates/aube-node/**", "crates/aube/**", "crates/aube-*/**", "Cargo.toml", "Cargo.lock", ".github/workflows/node-addon.yml"]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: node-addon-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions: {}

jobs:
  build:
    name: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin, os: darwin, cpu: arm64, package: darwin-arm64, binary: libaube_node.dylib, smoke: true }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, os: darwin, cpu: x64, package: darwin-x64, binary: libaube_node.dylib, smoke: true }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, os: linux, cpu: arm64, package: linux-arm64, binary: libaube_node.so, smoke: true }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, os: linux, cpu: x64, package: linux-x64, binary: libaube_node.so, smoke: true }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, os: linux, cpu: arm64, libc: musl, package: linux-arm64-musl, binary: libaube_node.so }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, os: linux, cpu: x64, libc: musl, package: linux-x64-musl, binary: libaube_node.so }
          - { runner: windows-latest, target: aarch64-pc-windows-msvc, os: win32, cpu: arm64, package: win32-arm64, binary: aube_node.dll }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, os: win32, cpu: x64, package: win32-x64, binary: aube_node.dll, smoke: true }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: "24", package-manager-cache: false }
      - name: Install Rust target
        shell: bash
        run: rustup target add '${{ matrix.target }}'
      - name: Install musl compiler
        if: matrix.libc == 'musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build addon
        shell: bash
        run: cargo build --locked --profile napi -p aube-node --target '${{ matrix.target }}'
      - name: Import macOS signing certificate
        if: github.event_name == 'release' && matrix.os == 'darwin'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASS }}
      - name: Sign macOS addon
        if: github.event_name == 'release' && matrix.os == 'darwin'
        shell: bash
        run: |
          codesign --force --sign 'Developer ID Application: Jeffrey Dickey (4993Y37DX6)' \
            --options runtime --timestamp \
            'target/${{ matrix.target }}/napi/${{ matrix.binary }}'
      - name: Set package version
        id: version
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' == release ]]; then version='${{ github.event.release.tag_name }}'; version=${version#v}; else version="0.0.0-smoke.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Pack platform package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OUT_DIR: ${{ runner.temp }}/packages
          AUBE_NODE_BINARY: target/${{ matrix.target }}/napi/${{ matrix.binary }}
          AUBE_NODE_OS: ${{ matrix.os }}
          AUBE_NODE_CPU: ${{ matrix.cpu }}
          AUBE_NODE_LIBC: ${{ matrix.libc }}
        run: node crates/aube-node/npm/package.mjs
      - name: Smoke-load native addon
        if: matrix.smoke
        shell: bash
        run: |
          cp 'target/${{ matrix.target }}/napi/${{ matrix.binary }}' '${{ runner.temp }}/aube.node'
          node -e "require('${{ runner.temp }}/aube.node')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aube-node-${{ matrix.package }}
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error

  packages:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: "24", package-manager-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { pattern: aube-node-*, path: packages, merge-multiple: true }
      - name: Pack root package
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' == release ]]; then VERSION='${{ github.event.release.tag_name }}'; VERSION=${VERSION#v}; else VERSION="0.0.0-smoke.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"; fi
          VERSION="$VERSION" OUT_DIR="$PWD/packages" node crates/aube-node/npm/package.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: aube-node-npm-packages, path: "packages/*.tgz", if-no-files-found: error }
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        if: github.event_name == 'release'
        with: { subject-path: "packages/*.tgz" }
      - name: Publish platform and root packages
        if: github.event_name == 'release'
        shell: bash
        run: |
          version='${{ github.event.release.tag_name }}'; version=${version#v}; tag=latest; [[ "$version" == *-* ]] && tag=next
          for package in packages/*-darwin-*.tgz packages/*-linux-*.tgz packages/*-win32-*.tgz; do npm publish "$package" --access public --provenance --tag "$tag"; done
          npm publish "packages/jdxcode-aube-node-${version}.tgz" --access public --provenance --tag "$tag"
