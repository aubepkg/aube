name: node-addon

on:
  pull_request:
    paths:
      - "crates/aube-node/**"
      - "crates/aube-codes/**"
      - "!crates/aube-codes/CHANGELOG.md"
      - "crates/aube-registry/src/config/**"
      - "crates/aube-registry/src/lib.rs"
      - "crates/aube/src/lib.rs"
      - "crates/aube/src/embed.rs"
      - "crates/aube/src/commands/add/mod.rs"
      - "crates/aube/src/commands/install/control.rs"
      - "crates/aube/src/commands/install/dep_selection.rs"
      - "crates/aube/src/commands/install/frozen.rs"
      - "crates/aube-util/src/identity.rs"
      - "crates/aube-util/src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/node-addon.yml"
      - ".github/workflows/node-addon-impl.yml"
  push:
    branches: [main]
    paths:
      - "crates/aube-node/**"
      - "crates/aube-codes/**"
      - "!crates/aube-codes/CHANGELOG.md"
      - "crates/aube-registry/src/config/**"
      - "crates/aube-registry/src/lib.rs"
      - "crates/aube/src/lib.rs"
      - "crates/aube/src/embed.rs"
      - "crates/aube/src/commands/add/mod.rs"
      - "crates/aube/src/commands/install/control.rs"
      - "crates/aube/src/commands/install/dep_selection.rs"
      - "crates/aube/src/commands/install/frozen.rs"
      - "crates/aube-util/src/identity.rs"
      - "crates/aube-util/src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/node-addon.yml"
      - ".github/workflows/node-addon-impl.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v1.28.0) to publish packages for. Empty runs a smoke build."
        required: false
        default: ""

permissions: {}

jobs:
  trusted:
    if: ${{ github.event_name == 'release' || inputs.tag != '' || (github.actor == 'jdx' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'jdx'))) }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/node-addon-impl.yml
    with:
      tag: ${{ inputs.tag || '' }}
      trusted: true
      mbx-backend: server
    secrets:
      CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
      CERTIFICATES_P12_PASS: ${{ secrets.CERTIFICATES_P12_PASS }}

  untrusted:
    if: ${{ github.event_name != 'release' && inputs.tag == '' && (github.actor != 'jdx' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login != 'jdx'))) }}
    permissions:
      contents: read
    uses: ./.github/workflows/node-addon-impl.yml
    with:
      tag: ""
      trusted: false
      mbx-backend: github

  packages:
    name: packages
    if: ${{ always() && !cancelled() && needs.trusted.result != 'cancelled' && needs.untrusted.result != 'cancelled' }}
    permissions: {}
    needs: [trusted, untrusted]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check selected workflow result
        env:
          TRUSTED_RESULT: ${{ needs.trusted.result }}
          UNTRUSTED_RESULT: ${{ needs.untrusted.result }}
        run: |
          if [[ "$TRUSTED_RESULT" == success && "$UNTRUSTED_RESULT" == skipped ]] ||
             [[ "$TRUSTED_RESULT" == skipped && "$UNTRUSTED_RESULT" == success ]]; then
            exit 0
          fi
          echo "trusted=$TRUSTED_RESULT untrusted=$UNTRUSTED_RESULT"
          exit 1
