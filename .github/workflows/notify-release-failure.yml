name: notify-release-failure

# Release-triggered publish workflows do not have a PR check. Alert when one
# fails so a published release cannot silently remain only partially shipped.
# jactionlint ignore=dangerous-triggers
on:
  workflow_run:
    # Each release-published downstream publisher is listed once. The
    # per-workflow-run concurrency key prevents duplicate delivery for the
    # same run while still reporting a distinct failed publisher.
    workflows: [release, publish-homebrew, publish-npm, ppa-publish, copr-publish, node-addon, ffi]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions: {}

jobs:
  notify:
    if: ${{ github.repository == 'aubepkg/aube' && github.event.workflow_run.event == 'release' && contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failure email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${NOTIFY_EMAIL:-}" ]; then
            echo "::warning::RESEND_API_KEY or NOTIFY_EMAIL is unset; skipping notification for ${WORKFLOW}"
            exit 0
          fi
          payload=$(jq -n \
            --arg to "$NOTIFY_EMAIL" \
            --arg workflow "$WORKFLOW" \
            --arg conclusion "$CONCLUSION" \
            --arg run_url "$RUN_URL" \
            --arg attempt "$ATTEMPT" \
            '
            { from: "aube Releases <mise@en.dev>", to: [$to],
              subject: "❌ aube \($workflow) \($conclusion)",
              html: ("<p>The <strong>\($workflow | @html)</strong> workflow finished with <strong>\($conclusion | @html)</strong> on attempt \($attempt | @html).</p>" + "<p>The release is published but this workflow output did not ship. Re-run it once the cause is fixed.</p>" + "<p><a href=\"\($run_url | @html)\">View workflow run</a></p>")
            }')
          curl --fail-with-body -sS \
            --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: aube-release-failure-${RUN_ID}-${ATTEMPT}" \
            -d "$payload"
