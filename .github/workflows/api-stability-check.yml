name: API stability check

on:
  workflow_call:
    inputs:
      check:
        description: Stable cache namespace for this check
        required: true
        type: string
      packages:
        description: Space-separated Rust packages; empty selects the C ABI check
        default: ""
        type: string
    outputs:
      results_present:
        value: ${{ jobs.check.outputs.results_present }}
      checks_passed:
        value: ${{ jobs.check.outputs.checks_passed }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    outputs:
      results_present: ${{ steps.report.outputs.results_present }}
      checks_passed: ${{ steps.report.outputs.checks_passed }}
    env:
      MBX_DISABLE: "1"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ inputs.packages != '' && 'target-api' || 'target' }}
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0 # zizmor: ignore[cache-poisoning] only main saves
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare Rust toolchain
        run: rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning] only main saves
        with:
          shared-key: api-${{ inputs.check }}-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # rust-cache's target cleanup removes rustdoc JSON and generated
          # manifests even with cache-targets disabled. Keep the API target
          # outside the default workspace target that rust-cache cleans.
          cache-targets: ${{ inputs.packages == '' }}
          cache-directories: ${{ inputs.packages != '' && 'target-api' || '' }}
      - name: Select semver baseline
        if: inputs.packages != ''
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Main compares against itself to warm the same build/cache paths
          # without treating already-merged API changes as new regressions.
          echo "SEMVER_BASELINE=${PR_BASE_SHA:-$(git rev-parse HEAD)}" >> "$GITHUB_ENV"
      - name: Published Rust APIs
        id: rust
        if: inputs.packages != ''
        continue-on-error: true
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          read -r -a packages <<< "$PACKAGES"
          args=()
          for package in "${packages[@]}"; do
            args+=(--package "$package")
          done
          /usr/bin/time -v ./bin/cargo-semver-checks semver-checks \
            --baseline-rev "$SEMVER_BASELINE" "${args[@]}"
      - name: C ABI — frozen export set
        id: ffi
        if: inputs.packages == ''
        continue-on-error: true
        run: |
          # Exported names do not require release optimization or LTO. The
          # default dev profile also unwinds, as required by the FFI boundary.
          /usr/bin/time -v mise exec -- cargo build --locked -p aube-ffi
          grep -vE '^[[:space:]]*(#|$)' crates/aube-ffi/abi-symbols.txt | sort -u > /tmp/abi-expected.txt
          nm -D --defined-only --extern-only target/debug/libaube_ffi.so \
            | awk '{ print $3 }' | grep '^aube_' | sort -u > /tmp/abi-actual.txt
          diff -u /tmp/abi-expected.txt /tmp/abi-actual.txt
      - name: Report check result
        id: report
        if: always()
        env:
          OUTCOME: ${{ inputs.packages != '' && steps.rust.outcome || steps.ffi.outcome }}
        run: |
          case "$OUTCOME" in
            success)
              echo "results_present=true" >> "$GITHUB_OUTPUT"
              echo "checks_passed=true" >> "$GITHUB_OUTPUT"
              ;;
            failure)
              echo "results_present=true" >> "$GITHUB_OUTPUT"
              echo "checks_passed=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            *)
              echo "results_present=false" >> "$GITHUB_OUTPUT"
              echo "checks_passed=false" >> "$GITHUB_OUTPUT"
              echo "::error::API check did not complete"
              exit 1
              ;;
          esac
