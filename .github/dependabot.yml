version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    exclude-paths:
      - "fixtures/**"
    ignore:
      - dependency-name: "yamlpath"
    groups:
      sigstore:
        patterns:
          - "sigstore-*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    exclude-paths:
      - "fixtures/**"

  # exclude-paths only covers version updates; a limit of 0 also stops
  # security update PRs for the fixture lockfiles.
  - package-ecosystem: "npm"
    directories:
      - "/fixtures/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
