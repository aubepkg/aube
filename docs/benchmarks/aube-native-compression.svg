<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190" role="img" aria-labelledby="title desc">
  <title id="title">Aube native addon compression results</title>
  <desc id="desc">On three macOS ARM64 native addons, the Aube LZFSE-first path used less APFS storage, completed compression and verification faster, and reduced peak process memory. Native load time stayed within half a millisecond.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#121d32"/>
    </linearGradient>
    <linearGradient id="newBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ec7a4"/>
      <stop offset="1" stop-color="#38d6bd"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".28"/>
    </filter>
    <style>
      .title { font: 700 38px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#f8fafc }
      .subtitle { font: 400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#a8b6cb }
      .impact { font: 700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#d8fff6 }
      .card { fill:#f8fafc; stroke:#dbe4ee; stroke-width:1 }
      .cardtitle { font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#132238 }
      .cardunit { font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#64748b }
      .legend { font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#526176 }
      .pkg { font:650 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#1e293b }
      .value { font:650 13px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#334155 }
      .delta { font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#07866f }
      .deltaNeutral { font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#536176 }
      .axis { font:400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#8693a5 }
      .grid { stroke:#e2e8f0; stroke-width:1 }
      .old { fill:#8290a3 }
      .new { fill:url(#newBar) }
      .calloutHead { font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#eafffa }
      .calloutText { font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#c5d3e5 }
      .foot { font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#99a8bc }
    </style>
  </defs>
  <rect width="1600" height="1190" rx="26" fill="url(#bg)"/>
  <text x="70" y="70" class="title">Aube native addons: smaller, faster installs</text>
  <text x="70" y="105" class="subtitle">Measured on Apple Silicon macOS using three installed ARM64 addons and Aube’s APFS compression path</text>
  <rect x="70" y="128" width="1460" height="54" rx="14" fill="#123b3b" stroke="#1e7167"/>
  <text x="96" y="162" class="impact">0.9 MB less APFS allocation  ·  23% faster fresh-store compression + verification  ·  1.4–6.4 MB lower peak RSS</text>

  <!-- APFS allocated size -->
  <g filter="url(#shadow)"><rect x="70" y="210" width="710" height="350" rx="18" class="card"/></g>
  <text x="100" y="250" class="cardtitle">APFS space used</text>
  <text x="100" y="273" class="cardunit">Allocated size · MB · lower is better</text>
  <rect x="565" y="235" width="12" height="12" rx="3" class="old"/><text x="584" y="246" class="legend">LZVN first</text>
  <rect x="670" y="235" width="12" height="12" rx="3" class="new"/><text x="689" y="246" class="legend">LZFSE first</text>
  <line x1="250" y1="300" x2="250" y2="510" class="grid"/><line x1="350" y1="300" x2="350" y2="510" class="grid"/><line x1="450" y1="300" x2="450" y2="510" class="grid"/><line x1="550" y1="300" x2="550" y2="510" class="grid"/><line x1="650" y1="300" x2="650" y2="510" class="grid"/>
  <text x="100" y="326" class="pkg">Oxlint</text><rect x="250" y="308" width="296" height="13" rx="6" class="old"/><text x="554" y="319" class="value">5.9</text><rect x="250" y="329" width="281" height="13" rx="6" class="new"/><text x="539" y="340" class="value">5.6</text><text x="691" y="332" class="delta">−5.3%</text>
  <text x="100" y="400" class="pkg">Rolldown</text><rect x="250" y="382" width="400" height="13" rx="6" class="old"/><text x="658" y="393" class="value">8.0</text><rect x="250" y="403" width="380" height="13" rx="6" class="new"/><text x="638" y="414" class="value">7.6</text><text x="691" y="406" class="delta">−5.1%</text>
  <text x="100" y="474" class="pkg">Lightning CSS</text><rect x="250" y="456" width="185" height="13" rx="6" class="old"/><text x="443" y="467" class="value">3.7</text><rect x="250" y="477" width="175" height="13" rx="6" class="new"/><text x="433" y="488" class="value">3.5</text><text x="691" y="480" class="delta">−5.1%</text>
  <text x="247" y="530" class="axis">0</text><text x="345" y="530" class="axis">2</text><text x="445" y="530" class="axis">4</text><text x="545" y="530" class="axis">6</text><text x="645" y="530" class="axis">8</text>

  <!-- APFS compression + verification time -->
  <g filter="url(#shadow)"><rect x="820" y="210" width="710" height="350" rx="18" class="card"/></g>
  <text x="850" y="250" class="cardtitle">Fresh-store install work</text>
  <text x="850" y="273" class="cardunit">Compression, APFS write, and verified readback · ms</text>
  <rect x="1315" y="235" width="12" height="12" rx="3" class="old"/><text x="1334" y="246" class="legend">LZVN first</text>
  <rect x="1420" y="235" width="12" height="12" rx="3" class="new"/><text x="1439" y="246" class="legend">LZFSE first</text>
  <line x1="1000" y1="300" x2="1000" y2="510" class="grid"/><line x1="1100" y1="300" x2="1100" y2="510" class="grid"/><line x1="1200" y1="300" x2="1200" y2="510" class="grid"/><line x1="1300" y1="300" x2="1300" y2="510" class="grid"/><line x1="1400" y1="300" x2="1400" y2="510" class="grid"/>
  <text x="850" y="326" class="pkg">Oxlint</text><rect x="1000" y="308" width="361" height="13" rx="6" class="old"/><text x="1369" y="319" class="value">48.2</text><rect x="1000" y="329" width="275" height="13" rx="6" class="new"/><text x="1283" y="340" class="value">36.7</text><text x="1440" y="332" class="delta">−24%</text>
  <text x="850" y="400" class="pkg">Rolldown</text><rect x="1000" y="382" width="450" height="13" rx="6" class="old"/><text x="1458" y="393" class="value">60.0</text><rect x="1000" y="403" width="347" height="13" rx="6" class="new"/><text x="1355" y="414" class="value">46.3</text><text x="1440" y="432" class="delta">−23%</text>
  <text x="850" y="474" class="pkg">Lightning CSS</text><rect x="1000" y="456" width="234" height="13" rx="6" class="old"/><text x="1242" y="467" class="value">31.2</text><rect x="1000" y="477" width="179" height="13" rx="6" class="new"/><text x="1187" y="488" class="value">23.9</text><text x="1440" y="480" class="delta">−23%</text>
  <text x="997" y="530" class="axis">0</text><text x="1097" y="530" class="axis">15</text><text x="1197" y="530" class="axis">30</text><text x="1297" y="530" class="axis">45</text><text x="1397" y="530" class="axis">60</text>

  <!-- Peak RSS -->
  <g filter="url(#shadow)"><rect x="70" y="590" width="710" height="350" rx="18" class="card"/></g>
  <text x="100" y="630" class="cardtitle">Peak process memory</text>
  <text x="100" y="653" class="cardunit">End-to-end fresh import · MB RSS · lower is better</text>
  <rect x="565" y="615" width="12" height="12" rx="3" class="old"/><text x="584" y="626" class="legend">LZVN first</text>
  <rect x="670" y="615" width="12" height="12" rx="3" class="new"/><text x="689" y="626" class="legend">LZFSE first</text>
  <line x1="250" y1="680" x2="250" y2="890" class="grid"/><line x1="350" y1="680" x2="350" y2="890" class="grid"/><line x1="450" y1="680" x2="450" y2="890" class="grid"/><line x1="550" y1="680" x2="550" y2="890" class="grid"/><line x1="650" y1="680" x2="650" y2="890" class="grid"/>
  <text x="100" y="706" class="pkg">Oxlint</text><rect x="250" y="688" width="347" height="13" rx="6" class="old"/><text x="605" y="699" class="value">48.6</text><rect x="250" y="709" width="320" height="13" rx="6" class="new"/><text x="578" y="720" class="value">44.8</text><text x="691" y="712" class="delta">−3.8</text>
  <text x="100" y="780" class="pkg">Rolldown</text><rect x="250" y="762" width="450" height="13" rx="6" class="old"/><text x="708" y="773" class="value">63.1</text><rect x="250" y="783" width="404" height="13" rx="6" class="new"/><text x="662" y="794" class="value">56.7</text><text x="691" y="812" class="delta">−6.4</text>
  <text x="100" y="854" class="pkg">Lightning CSS</text><rect x="250" y="836" width="263" height="13" rx="6" class="old"/><text x="521" y="847" class="value">36.9</text><rect x="250" y="857" width="254" height="13" rx="6" class="new"/><text x="512" y="868" class="value">35.5</text><text x="691" y="860" class="delta">−1.4</text>
  <text x="247" y="920" class="axis">0</text><text x="347" y="920" class="axis">15</text><text x="447" y="920" class="axis">30</text><text x="547" y="920" class="axis">45</text><text x="647" y="920" class="axis">60</text>

  <!-- Native load -->
  <g filter="url(#shadow)"><rect x="820" y="590" width="710" height="350" rx="18" class="card"/></g>
  <text x="850" y="630" class="cardtitle">Native module load</text>
  <text x="850" y="653" class="cardunit">Fresh Node process · median `require()` time · ms</text>
  <rect x="1315" y="615" width="12" height="12" rx="3" class="old"/><text x="1334" y="626" class="legend">LZVN first</text>
  <rect x="1420" y="615" width="12" height="12" rx="3" class="new"/><text x="1439" y="626" class="legend">LZFSE first</text>
  <line x1="1000" y1="680" x2="1000" y2="890" class="grid"/><line x1="1100" y1="680" x2="1100" y2="890" class="grid"/><line x1="1200" y1="680" x2="1200" y2="890" class="grid"/><line x1="1300" y1="680" x2="1300" y2="890" class="grid"/><line x1="1400" y1="680" x2="1400" y2="890" class="grid"/>
  <text x="850" y="706" class="pkg">Oxlint</text><rect x="1000" y="688" width="333" height="13" rx="6" class="old"/><text x="1341" y="699" class="value">33.3</text><rect x="1000" y="709" width="338" height="13" rx="6" class="new"/><text x="1346" y="720" class="value">33.8</text><text x="1440" y="712" class="deltaNeutral">+1.5%</text>
  <text x="850" y="780" class="pkg">Rolldown</text><rect x="1000" y="762" width="337" height="13" rx="6" class="old"/><text x="1345" y="773" class="value">33.7</text><rect x="1000" y="783" width="340" height="13" rx="6" class="new"/><text x="1348" y="794" class="value">34.0</text><text x="1440" y="786" class="deltaNeutral">+0.9%</text>
  <text x="850" y="854" class="pkg">Lightning CSS</text><rect x="1000" y="836" width="325" height="13" rx="6" class="old"/><text x="1333" y="847" class="value">32.5</text><rect x="1000" y="857" width="321" height="13" rx="6" class="new"/><text x="1329" y="868" class="value">32.1</text><text x="1440" y="860" class="delta">−1.2%</text>
  <text x="997" y="920" class="axis">0</text><text x="1097" y="920" class="axis">10</text><text x="1197" y="920" class="axis">20</text><text x="1297" y="920" class="axis">30</text><text x="1397" y="920" class="axis">40</text>

  <rect x="70" y="972" width="1460" height="94" rx="16" fill="#172d43" stroke="#2b4b68"/>
  <text x="98" y="1008" class="calloutHead">Zstd hybrid decoder: 14–17% faster</text>
  <text x="98" y="1038" class="calloutText">Bounded bulk decoding for small napi frames reduced decode time on the same addon inputs. Peak decoder RSS was effectively unchanged; no memory saving is claimed for this path.</text>
  <text x="70" y="1102" class="foot">LZFSE vs LZVN. Fresh APFS files, actual allocated blocks, and full Aube `compress_bytes` readback verification. Values are release-profile medians from 3 fresh-process runs.</text>
  <text x="70" y="1125" class="foot">Native load: 9 paired Node launches per run, repeated 3 times; LZFSE changed these medians by −0.4 to +0.5 ms. zstd comparison used level-3 frames made from the same addon files.</text>
</svg>
